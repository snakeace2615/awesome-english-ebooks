name: Sync upstream

on:
  schedule:
    # Check for upstream updates every day at 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Sync master from upstream
        env:
          UPSTREAM_REPOSITORY: https://github.com/hehonghui/awesome-english-ebooks.git
        run: |
          set -eu

          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream master

          fork_master="$(git rev-parse HEAD)"
          upstream_master="$(git rev-parse refs/remotes/upstream/master)"

          if git merge-base --is-ancestor "$upstream_master" "$fork_master"; then
            echo "Fork master already contains upstream/master; nothing to sync."
            exit 0
          fi

          if git merge-base --is-ancestor "$fork_master" "$upstream_master"; then
            echo "Fast-forwarding fork master to upstream/master."
            git push origin "$upstream_master:refs/heads/master"
            exit 0
          fi

          echo "Fork master contains local commits; merging upstream/master without rewriting history."
          git merge --no-edit --no-ff "$upstream_master"
          git push origin "HEAD:refs/heads/master"
